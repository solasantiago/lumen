name: Sincronizar materias

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [lumen-sync]

permissions:
  contents: write
  actions: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Traer lumen.json de cada materia
        id: traer
        run: node scripts/sincronizar.mjs
        env:
          LUMEN_SYNC_TOKEN: ${{ secrets.LUMEN_SYNC_TOKEN }}
      - name: Guardar cambios y publicar
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "Sin cambios en data/."
            exit 0
          fi
          git config user.name "lumen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "sync: métricas de materias ($(date +%F))"
          git push
          # Un push hecho con GITHUB_TOKEN no dispara otros workflows: la publicación se pide a mano.
          gh workflow run publicar.yml --ref main
